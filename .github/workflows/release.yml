name: Release firmware

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v5

      # ESP-IDF picks up version.txt as the app version (PROJECT_VER).
      # The checkout only has the commit; fetch the annotated tag for its message.
      - name: Set firmware version
        run: |
          echo "${GITHUB_REF_NAME}" > version.txt
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}

      # The ESP32-S3 assets keep their original names (fs-bms.bin, version.json),
      # which boards from before multi-chip support look for. Other chips get
      # fs-bms-<target>.bin and version-<target>.json (CONFIG_APP_OTA_MANIFEST_URL).
      - name: Prepare release assets
        run: |
          if [ "${{ matrix.target }}" = esp32s3 ]; then suffix=""; else suffix="-${{ matrix.target }}"; fi
          mkdir dist
          cp build/fs-bms.bin "dist/fs-bms${suffix}.bin"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")
          jq -n --arg v "${GITHUB_REF_NAME}" --arg u "${base}/fs-bms${suffix}.bin" --arg n "${notes}" \
            '{version: $v, url: $u, notes: $n}' > "dist/version${suffix}.json"
          cat "dist/version${suffix}.json"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
